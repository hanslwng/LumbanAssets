; LGU Inventory — desktop shortcut installer (Windows)
; Folder layout: lgue-shortcut-settings.ini must sit in the installer\ folder beside the PHP project root
; (the folder that contains bootstrap.php).
; Edit LoginUrl if the app is NOT at http://localhost/lgu_invent/
; Examples:
;   LoginUrl=http://localhost/lgu_invent/login
;   LoginUrl=http://192.168.1.10/lgu_invent/login

; Optional: path to .ico file (best for shortcuts). Leave IconPath blank to auto-use logo.png.
; IconPath=C:\Apps\LGUE\installer\lgue.ico

LoginUrl=http://localhost/lgu_invent/login
ShortcutName=LGU Inventory
